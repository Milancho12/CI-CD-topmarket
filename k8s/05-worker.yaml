apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: topmarket-namespace
spec:
  selector:
    app: worker
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topmarket-worker
  namespace: topmarket-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: milan071/topmarket-worker:latest
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: topmarket-config
                  key: WORKER_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: topmarket-secrets
                  key: DATABASE_URL
            - name: SOCKS5_PROXY
              valueFrom:
                secretKeyRef:
                  name: topmarket-secrets
                  key: SOCKS5_PROXY
            - name: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
              valueFrom:
                configMapKeyRef:
                  name: topmarket-config
                  key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
            - name: PUPPETEER_EXECUTABLE_PATH
              valueFrom:
                configMapKeyRef:
                  name: topmarket-config
                  key: PUPPETEER_EXECUTABLE_PATH
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: topmarket-config
                  key: TZ
